<title>input</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#f1e8d4;color:#2a2118;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{display:grid;place-items:center;padding:24px;background-image:radial-gradient(circle at 10% 0%,rgba(246,200,150,.5),transparent 45%),radial-gradient(circle at 100% 100%,rgba(214,226,186,.5),transparent 45%)}
form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em}
p{font-size:15px;line-height:1.45;color:rgba(42,33,24,.62);font-weight:500}
input[type=password]{width:100%;height:56px;border-radius:18px;border:2px solid transparent;background:rgba(88,62,20,.085);padding:0 18px;font:600 17px inherit;color:#2a2118;outline:none}
input[type=password]:focus{border-color:#d09a3a;background:#f8f2e3}
label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:rgba(42,33,24,.7)}
label input{width:18px;height:18px;accent-color:#d09a3a}
button{height:56px;border-radius:18px;border:0;background:#d09a3a;color:#fff;font:800 17px inherit;cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:20px;font-size:14px;font-weight:700;color:#a8553f}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>input</h1>
  <p>Тестова версия. Въведи паролата, която си получил.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Парола" autofocus>
  <label><input id="rem" type="checkbox" checked> Запомни на това устройство</label>
  <button id="go" type="submit">Отвори</button>
  <div id="err" role="alert"></div>
</form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},key,b(D.ct)));
}
function show(html){document.open();document.write(html);document.close()}
async function attempt(pw,silent){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;if(!silent)err.textContent='';
  try{
    const html=await unlock(pw);
    try{if(document.getElementById('rem').checked)localStorage.setItem('input_pw',pw);else localStorage.removeItem('input_pw')}catch(e){}
    show(html);
  }catch(e){
    btn.disabled=false;
    try{localStorage.removeItem('input_pw')}catch(_){}
    if(!silent)err.textContent='Грешна парола. Опитай пак.';
  }
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('pw').value;if(v)attempt(v,false)});
try{const saved=localStorage.getItem('input_pw');if(saved)attempt(saved,true)}catch(e){}
</script>
